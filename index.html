<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>3D Parkour & Boss Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; touch-action: none; user-select: none; }
        
        #startup-prompt {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        #startup-prompt h2 { font-size: 28px; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; }
        .start-btn {
            background: #4285F4; color: white; border: none; padding: 15px 30px;
            font-size: 18px; margin: 10px; border-radius: 8px; cursor: pointer; width: 280px;
            font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .start-btn:hover { background: #357ae8; }
        .start-btn.mobile-btn { background: #00ff88; color: black; }
        .start-btn.mobile-btn:hover { background: #00cc6a; }

        #ui-container { position: fixed; right: -260px; top: 20px; width: 260px; transition: right 0.3s ease-in-out; z-index: 10; }
        #ui-container.open { right: 20px; }
        #settings-toggle { position: absolute; left: -40px; top: 0; width: 40px; height: 40px; background: rgba(0,0,0,0.9); color: white; border: none; cursor: pointer; border-radius: 8px 0 0 8px; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 0; }
        #ui { background: rgba(0,0,0,0.9); padding: 20px; border-radius: 0 8px 8px 8px; box-sizing: border-box; width: 100%; color: white; }
        button { border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 8px; display: block; width: 100%; }
        .action-btn { background: #00ff88; color: black; }
        .action-btn:hover { background: #00cc6a; }
        #login-btn { background: #4285F4; color: white; }
        #logout-btn { background: #ff4444; color: white; display: none; }
        #status { color: #00ff88; font-size: 13px; margin-top: 10px; }
        #user-info { font-size: 12px; color: #aaa; margin-top: 8px; }
        #auth-section { margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        select { width: 100%; padding: 8px; margin-top: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        
        #cash-display { color: #ffd700; font-size: 18px; font-weight: bold; margin: 10px 0; text-align: center; background: #222; padding: 5px; border-radius: 4px; border: 1px solid #444; }

        /* Music Toggle Button & Slider Styling */
        #music-toggle { background: #9d00ff; color: white; margin-bottom: 8px; }
        #music-toggle.muted { background: #555; color: #aaa; }
        #volume-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        #volume-slider { width: 75%; cursor: pointer; accent-color: #9d00ff; }

        #mobile-controls {
            display: none; 
            position: absolute; bottom: 20px; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .m-btn {
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.4);
            color: white; border-radius: 50%; pointer-events: auto;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .m-btn:active { background: rgba(255, 255, 255, 0.5); }
        
        #dpad { position: absolute; bottom: 20px; left: 20px; display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 5px; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        #action-pad { position: absolute; bottom: 30px; right: 20px; display: flex; gap: 15px; }
        #action-pad .m-btn { width: 70px; height: 70px; font-size: 24px; border-radius: 12px; }

        #victory-return {
            display: none; 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            z-index: 20; 
            background: rgba(0,0,0,0.9); 
            padding: 15px; 
            border-radius: 8px; 
            border: 2px solid #00ff88; 
            text-align: center;
        }
        @media (max-width: 800px) {
            #victory-return { bottom: 230px; }
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
          }
        }
    </script>
</head>
<body>

    <div id="startup-prompt">
        <h2>Choose Your Controls</h2>
        <button id="choose-pc" class="start-btn">💻 Play on PC (Keyboard)</button>
        <button id="choose-mobile" class="start-btn mobile-btn">📱 Play on Phone (Touch)</button>
    </div>

    <!-- VICTORY RETURN MENU -->
    <div id="victory-return">
        <button id="return-btn" class="action-btn" style="margin-top: 0; width: 100%;">Return to Start</button>
        <p style="color: #ccc; font-size: 12px; margin: 8px 0 0 0;">(You'll keep your money!)</p>
    </div>

    <div id="mobile-controls">
        <div id="dpad">
            <div id="btn-up" class="m-btn">▲</div>
            <div id="btn-left" class="m-btn">◀</div>
            <div id="btn-right" class="m-btn">▶</div>
            <div id="btn-down" class="m-btn">▼</div>
        </div>
        <div id="action-pad">
            <div id="btn-punch" class="m-btn">👊</div>
            <div id="btn-jump" class="m-btn">⬆️</div>
        </div>
    </div>

    <div id="ui-container">
        <button id="settings-toggle">⚙️</button>
        <div id="ui">
            <h2 style="margin-top: 0; font-size: 18px;">Game Settings</h2>
            
            <div id="auth-section">
                <button id="login-btn">Sign in with Google</button>
                <button id="logout-btn">Log Out</button>
                <p id="user-info">Not logged in</p>
            </div>

            <div id="cash-display">Cash: $0</div>
            
            <button id="music-toggle">🔊 Music: ON</button>
            <div id="volume-container">
                <span style="font-size: 12px; color: #ccc;">Vol:</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="char-select" style="font-size: 13px; color: #ccc;">Character Shop:</label>
                <select id="char-select"></select>
            </div>

            <button id="save-btn" class="action-btn">Save Cloud Checkpoint</button>
            <button id="load-btn" class="action-btn">Load Cloud Checkpoint</button>
            <p id="status">Ready.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
