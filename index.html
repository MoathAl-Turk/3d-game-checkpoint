<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Parkour Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
        
        /* Slide-out Menu Container */
        #ui-container {
            position: fixed;
            right: -280px; /* Hidden off-screen by default */
            top: 20px;
            width: 250px;
            transition: right 0.3s ease-in-out;
            z-index: 10;
        }
        
        /* Class added by JS to slide it open */
        #ui-container.open { right: 20px; }

        /* The Gear Toggle Button */
        #settings-toggle {
            position: absolute;
            left: -45px;
            top: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px 0 0 8px;
            font-size: 20px;
        }

        #ui {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 0 8px 8px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: white;
        }

        button {
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 8px;
            display: block;
            width: 100%;
        }
        .action-btn { background: #00ff88; color: black; }
        .action-btn:hover { background: #00cc6a; }
        #login-btn { background: #4285F4; color: white; }
        #login-btn:hover { background: #357ae8; }
        #logout-btn { background: #ff4444; color: white; display: none; }
        
        #status { color: #00ff88; font-size: 13px; margin-top: 10px; }
        #user-info { font-size: 12px; color: #aaa; margin-top: 8px; }
        #auth-section { margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        select { width: 100%; padding: 8px; margin-top: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        
        /* Crosshair/Target dot for center of screen */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.5;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
          }
        }
    </script>
</head>
<body>
    <div id="crosshair"></div>

    <div id="ui-container">
        <button id="settings-toggle">⚙️</button>
        <div id="ui">
            <h2 style="margin-top: 0; font-size: 18px;">Game Settings</h2>
            <p style="font-size: 12px; color: #ccc;">WASD to Move | SPACE to Jump</p>
            
            <div id="auth-section">
                <button id="login-btn">Sign in with Google</button>
                <button id="logout-btn">Log Out</button>
                <p id="user-info">Not logged in</p>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="char-select" style="font-size: 13px; color: #ccc;">Choose Character:</label>
                <select id="char-select">
                    <option value="Casual_Male.gltf">Casual Male</option>
                    <option value="Casual_Female.gltf">Casual Female</option>
                    <option value="Pirate_Male.gltf">Pirate Male</option>
                    <option value="Pirate_Female.gltf">Pirate Female</option>
                    <option value="Zombie_Male.gltf">Zombie Male</option>
                </select>
            </div>

            <button id="save-btn" class="action-btn">Save Checkpoint</button>
            <button id="load-btn" class="action-btn">Load Checkpoint</button>
            <p id="status">Ready.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
