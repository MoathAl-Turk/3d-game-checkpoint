<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>3D Parkour & Boss Game</title>
    <style>
        /* Prevent pull-to-refresh and zooming on mobile */
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; touch-action: none; user-select: none; }
        
        #ui-container {
            position: fixed;
            right: -260px;
            top: 20px;
            width: 260px;
            transition: right 0.3s ease-in-out;
            z-index: 10;
        }
        
        #ui-container.open { right: 20px; }

        #settings-toggle {
            position: absolute;
            left: -40px; 
            top: 0;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.9);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px 0 0 8px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #ui {
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 0 8px 8px 8px;
            box-sizing: border-box;
            width: 100%;
            color: white;
        }

        button { border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 8px; display: block; width: 100%; }
        .action-btn { background: #00ff88; color: black; }
        .action-btn:hover { background: #00cc6a; }
        #login-btn { background: #4285F4; color: white; }
        #logout-btn { background: #ff4444; color: white; display: none; }
        
        #status { color: #00ff88; font-size: 13px; margin-top: 10px; }
        #user-info { font-size: 12px; color: #aaa; margin-top: 8px; }
        #auth-section { margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        select { width: 100%; padding: 8px; margin-top: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }

        /* --- MOBILE TOUCH CONTROLS --- */
        #mobile-controls {
            display: none; /* Hidden on desktop by default */
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through empty space */
            z-index: 5;
        }

        .m-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50%;
            pointer-events: auto; /* Re-enable touches just for buttons */
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .m-btn:active { background: rgba(255, 255, 255, 0.4); }

        #dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        #action-pad {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
        }
        #action-pad .m-btn { width: 70px; height: 70px; font-size: 24px; border-radius: 12px; }

        /* Show mobile controls only on mobile devices/small screens */
        @media (max-width: 800px) {
            #mobile-controls { display: block; }
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
          }
        }
    </script>
</head>
<body>
    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">
        <div id="dpad">
            <div id="btn-up" class="m-btn">▲</div>
            <div id="btn-left" class="m-btn">◀</div>
            <div id="btn-right" class="m-btn">▶</div>
            <div id="btn-down" class="m-btn">▼</div>
        </div>
        <div id="action-pad">
            <div id="btn-punch" class="m-btn">👊</div>
            <div id="btn-jump" class="m-btn">⬆️</div>
        </div>
    </div>

    <!-- SETTINGS UI -->
    <div id="ui-container">
        <button id="settings-toggle">⚙️</button>
        <div id="ui">
            <h2 style="margin-top: 0; font-size: 18px;">Game Settings</h2>
            <p style="font-size: 12px; color: #ccc;">WASD to Move | SPACE to Jump</p>
            
            <div id="auth-section">
                <button id="login-btn">Sign in with Google</button>
                <button id="logout-btn">Log Out</button>
                <p id="user-info">Not logged in</p>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="char-select" style="font-size: 13px; color: #ccc;">Choose Character:</label>
                <select id="char-select">
                    <option value="Casual_Male.gltf">Casual Male</option>
                    <option value="Casual_Female.gltf">Casual Female</option>
                    <option value="Pirate_Male.gltf">Pirate Male</option>
                    <option value="Pirate_Female.gltf">Pirate Female</option>
                    <option value="Zombie_Male.gltf">Zombie Male</option>
                </select>
            </div>

            <button id="save-btn" class="action-btn">Save Cloud Checkpoint</button>
            <button id="load-btn" class="action-btn">Load Cloud Checkpoint</button>
            <p id="status">Ready.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
