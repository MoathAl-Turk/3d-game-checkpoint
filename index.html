<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Checkpoint Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background: #00ff88;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 8px;
            display: block;
            width: 100%;
        }
        button:hover { background: #00cc6a; }
        #status { color: #00ff88; font-size: 13px; margin-top: 10px; word-break: break-all; }
    </style>

    <!-- Import Map for Three.js and Firebase SDKs -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
          }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>3D Game Sandbox</h2>
        <p>Use WASD or Arrow Keys to move</p>
        <button id="save-btn">Save Progress to Firebase</button>
        <button id="load-btn">Load Checkpoint</button>
        <p id="status">Ready.</p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
